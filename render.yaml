services:
  - type: web
    name: cloud-issue-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-issue-tracker-db
          property: connectionString

databases:
  - name: cloud-issue-tracker-db
    databaseName: issue_tracker
    user: issue_tracker_user
