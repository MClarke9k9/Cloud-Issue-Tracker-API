services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: issue_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d issue_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/issue_tracker?schema=public
      JWT_SECRET: docker-compose-demo-secret-change-me
      JWT_EXPIRES_IN: 1d
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"

volumes:
  postgres-data:
